; ESP32-C3 DevKitM-1 — ban tieng Viet.
;
; Ban sao cua env esp32-c3 trong boards/esp32-c3.ini, chi them
; -DFIRMWARE_LANG_VI=1 de src/lang/lang.h chon src/lang/vi.h.
; Moi thu khac (board, flash, phan vung, lib) giu nguyen.
; Build:
;   pio run -e esp32-c3-vi
;   pio run -e esp32-c3-vi --target upload

[env:esp32-c3-vi]
extends           = base, common_flags
board             = esp32-c3-devkitm-1
board_build.mcu   = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.filesystem = littlefs
board_build.partitions = partitions/esp32c3_4mb.csv
lib_deps =
    ${base.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    ${common_flags.build_flags}
    -DCHIP_NAME='"ESP32-C3"'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_BLE_HID=1
    -DMSC_SUPPORTED=0
    -DWPS_PIXIE_SUPPORTED=1
    -DFIRMWARE_LANG_VI=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

# Build Firmware (tieng Viet)
#
# Them cho ban tieng Viet cua NRSuite-Firmware.
# Workflow goc firmware-ci.yml van giu nguyen va build du 12 env.
# Workflow nay them:
#  - workflow_dispatch: bam Run workflow tren GitHub de build tay.
#  - env esp32-c3-vi: build ban tieng Viet (FIRMWARE_LANG_VI=1).
#  - ma tran gon hon (6 env chinh) de chay nhanh khi chi can kiem tra
#    ban tieng Viet, khong thay the CI day du.
# Chay khi push / pull request len main, develop, release/**.
name: Build Firmware (tiếng Việt)

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-firmware-vi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        environment: [esp32-c3, esp32-c3-vi, esp32-s3, esp32-s2, esp32-c5, esp32-devkit]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-vi-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini', 'partitions/*.csv', 'scripts/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pio-vi-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Validate target registry and partition layouts
        run: python3 scripts/validate_targets.py

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Verify merged image offsets
        run: python3 scripts/verify_merged_images.py --environment ${{ matrix.environment }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            release/*.bin
            beta-release/*.bin
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Validate target registry and partition layouts
        run: python3 scripts/validate_targets.py

      - name: Run native unit tests
        run: pio test -e native
